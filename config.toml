onboarding = false
[ui]
copy_on_select = false
agent_panel_sort = "spaces"
status_indicators = "symbols"

show_agent_labels_on_pane_borders = true

[[ui.tab_bar_right]]
type = "command"
interval_seconds = 60
command = '''
f=$(df -g / | awk 'NR==2{print $4}')
if [ "$f" -lt 5 ]; then
  herdr notification show "Disk low" --body "${f} GB free" --sound request >/dev/null
  echo "⚠ ${f}G free"
else
  echo "${f}G free"
fi
'''

[terminal]
new_cwd = "~/Documents/REPOS"

[ui.toast]
delivery = "system"

[ui.sound]
enabled = true

[keys]
prefix = "ctrl+a"
# Defaults blanked: herdr-app's ctrl-a menu (app/mods/prefix) replaces them; plugin keys.toml files add their own.
rename_pane = "prefix+r"
split_vertical = ""
close_pane = ""
zoom = "prefix+z"
new_workspace = "prefix+s"
rename_workspace = "prefix+shift+r"
goto = "prefix+:"
help = "prefix+?"
settings = ""
new_worktree = ""
workspace_picker = ""
detach = ""
reload_config = ""
open_notification_target = ""
new_tab = ""
rename_tab = ""
previous_tab = ""
next_tab = ""
switch_tab = ""
close_tab = ""
close_workspace = ""
edit_scrollback = ""
copy_mode = ""
focus_pane_left = ""
focus_pane_down = ""
focus_pane_up = ""
focus_pane_right = ""
swap_pane_left = ""
swap_pane_down = ""
swap_pane_up = ""
swap_pane_right = ""
cycle_pane_next = ""
cycle_pane_previous = ""
split_horizontal = ""
resize_mode = ""
toggle_sidebar = ""

[ui.sidebar.spaces]
rows = [["state_icon", "workspace"]]

[ui.sidebar.agents]
rows = [["state_icon", { token = "pane", bold = true }, { token = "agent", dim = true }, "$blocked"], ["state_text", { token = "workspace", dim = true }]]
