id = "herdr-blocked"
name = "herdr-blocked"
version = "0.1.0"
description = "Park blocked tasks in a ⛔ blocked tab and tag them in the agents list."
min_herdr_version = "0.9.0"
platforms = ["linux", "macos"]

[[actions]]
id = "toggle"
title = "Toggle blocked"
description = "Move the focused pane into (or back out of) its workspace's ⛔ blocked tab."
command = ["python3", "-I", "blocked.py", "toggle"]
